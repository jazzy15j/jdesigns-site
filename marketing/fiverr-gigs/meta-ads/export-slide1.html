<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Slide 1</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #07100a; --card: #0d1a10; --card-alt: #122016; --border: #2a4735;
    --green: #2ec27e; --green-dim: #1a7a4e; --green-glow: #113822;
    --white: #ffffff; --muted: #bcdac8; --label: #e7f3ec;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-serif: Georgia, 'Times New Roman', serif;
  }
  html, body { margin: 0; padding: 0; background: var(--bg); overflow: hidden; }
  .slide { width: 1280px; height: 769px; position: relative; overflow: hidden; background: var(--bg); color: var(--white); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
  .glow { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background: radial-gradient(ellipse 70% 60% at 12% 0%, rgba(30,120,70,0.32) 0%, transparent 55%),
                radial-gradient(ellipse 60% 60% at 100% 40%, rgba(18,72,110,0.14) 0%, transparent 60%),
                radial-gradient(ellipse 55% 45% at 45% 100%, rgba(10,55,35,0.26) 0%, transparent 55%); }

  .grid { position: relative; z-index: 2; height: 100%; display: grid; grid-template-columns: 690px 590px; }

  .left { padding: 50px 24px 50px 54px; display: flex; flex-direction: column; height: 100%; justify-content: center; gap: 46px; }

  .headline { font-family: var(--font-serif); font-size: 64px; line-height: 1.08; letter-spacing: -0.01em; }
  .headline em { font-style: italic; color: var(--green); }
  .sub2 { font-size: 22px; line-height: 1.4; color: var(--label); font-weight: 600; margin-top: 16px; max-width: 600px; }

  .stats { display: flex; flex-direction: column; gap: 14px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 17px 24px; display: flex; align-items: center; gap: 20px; }
  .badge { width: 54px; height: 54px; border-radius: 50%; background: var(--green-glow); border: 1px solid var(--green-dim); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .badge svg { width: 28px; height: 28px; stroke: var(--green); fill: none; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
  .stat-text { display: flex; align-items: baseline; gap: 14px; }
  .stat-num { font-family: var(--font-sans); font-weight: 800; font-size: 38px; color: var(--white); line-height: 1; }
  .stat-label { font-size: 19px; color: var(--label); font-weight: 700; }

  .right { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; }

  .photo-frame { width: 400px; background: var(--card); border: 2px solid var(--green-dim); border-radius: 28px; padding: 14px; box-shadow: 0 0 0 1px rgba(46,194,126,0.08); }
  .photo-frame img { width: 100%; height: 400px; object-fit: cover; object-position: top center; border-radius: 18px; display: block; }

  .cred-name-row { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .cred-name { font-family: var(--font-serif); font-size: 38px; color: var(--white); line-height: 1; }
  .verified-icon { width: 28px; height: 28px; border-radius: 50%; background: var(--green); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .verified-icon svg { width: 16px; height: 16px; stroke: var(--bg); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .cred-title { font-size: 19px; color: var(--green); font-weight: 800; text-align: center; }
  .cred-line { font-size: 16.5px; color: var(--muted); font-weight: 600; text-align: center; }
</style>
</head>
<body>
<div class="slide" id="slide1">
  <div class="glow"></div>
  <div class="grid">
    <div class="left">
      <div>
        <div class="headline">Meta Ads That <em>Actually Convert.</em></div>
        <div class="sub2">I'll build and optimize your Facebook &amp; Instagram ad campaigns myself, from strategy to creative.</div>
      </div>

      <div class="stats">
        <div class="stat">
          <div class="badge"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
          <div class="stat-text"><div class="stat-num">316</div><div class="stat-label">Orders Completed</div></div>
        </div>
        <div class="stat">
          <div class="badge"><svg viewBox="0 0 24 24" fill="var(--green)" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></div>
          <div class="stat-text"><div class="stat-num">4.8</div><div class="stat-label">Average Rating</div></div>
        </div>
        <div class="stat">
          <div class="badge"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg></div>
          <div class="stat-text"><div class="stat-num">95%</div><div class="stat-label">On-Time Delivery</div></div>
        </div>
      </div>
    </div>

    <div class="right">
      <div class="photo-frame"><img src="jasmineheadshot.png" alt="Jasmine"></div>
      <div>
        <div class="cred-name-row">
          <div class="cred-name">Jasmine</div>
          <div class="verified-icon"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
        </div>
        <div class="cred-title" style="margin-top:8px;">Founder, JDesigns Strategist &middot; Vetted Pro</div>
        <div class="cred-line" style="margin-top:6px;">96/100 Seller Score &middot; 70% of Clients Repeat</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
